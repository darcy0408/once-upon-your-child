# Railway Multi-Service Configuration for Story Weaver App
# Deploys the backend (Flask/Python), Celery worker, and Celery beat scheduler.
# The frontend runs on Cloudflare Pages, not Railway (see note at bottom).

# Default deployment settings (don't set global healthcheck - only for web services)
[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Backend Service (Python Flask API)
# startCommand is the canonical boot path (it overrides the Dockerfile CMD at
# runtime). The Dockerfile CMD is kept identical as a local-dev fallback.
# nixpacks.toml was removed (L-9) — the Docker build is authoritative.
[[services]]
name = "backend"
dockerfile = "Dockerfile"
buildCommand = "pip install --no-cache-dir -r backend/requirements.txt"
# gthread: /generate-story can hold a request open for the full sync wait
# (~100s, see SYNC_STORY_TIMEOUT_CEILING_SECONDS) — with the old 2 sync
# workers, two concurrent generations stalled ALL other traffic (task-status
# polls, TTS, illustrations) behind them. These endpoints are pure I/O waits,
# so threads are the right worker class.
startCommand = "sh -c 'gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2 --worker-class gthread --threads 8'"

[services.healthcheck]
path = "/health"
interval = 30
timeout = 10

[services.env]
FLASK_ENV = "prod"
FLASK_CONFIG = "prod"
SYNC_STORY_TIMEOUT_SECONDS = "75"
GEMINI_REQUEST_TIMEOUT_SECONDS = "45"
GEMINI_IMAGE_REQUEST_TIMEOUT_SECONDS = "120"

# Celery Worker Service (Background task processor)
[[services]]
name = "lovely-perfection"
dockerfile = "Dockerfile.worker"
# --pool=threads: story generation is pure I/O (HTTPS to OpenAI/OpenRouter),
# so a thread pool gives real concurrency — with the old --pool=solo the
# whole app generated ONE story at a time and user B's request queued behind
# the entirety of user A's generation (MT-338 latency math: N concurrent
# users ≈ N × single-story wall time). solo existed only because the prefork
# pool's fork() broke gRPC-based Gemini calls; threads never fork, so that
# hazard is gone too. Note task_time_limit is not enforced by the threads
# pool — neither did solo — per-call HTTP timeouts on the OpenAI clients
# bound runaway tasks instead. Beat stays a separate dedicated service so
# scheduled jobs (the data-retention purge, CMP-5) fire. See MT-148.
startCommand = "celery -A backend.celery_config.celery worker --loglevel=info --pool=threads --concurrency=4"

# No healthcheck needed for worker (it's not a web service)
# No public networking needed (worker connects to Redis privately)

[services.env]
CELERY_TASK_ALWAYS_EAGER = "false"
CELERY_TASK_EAGER_PROPAGATES = "false"
CELERY_TASK_STORE_EAGER_RESULT = "false"
SYNC_STORY_TIMEOUT_SECONDS = "75"
GEMINI_REQUEST_TIMEOUT_SECONDS = "45"
GEMINI_IMAGE_REQUEST_TIMEOUT_SECONDS = "120"
# Redis URLs - set these in Railway UI using ${{Redis.REDIS_URL}}
# CELERY_BROKER_URL = "${{Redis.REDIS_URL}}"
# CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}"

# Celery Beat Service (Scheduler)
# Runs the celery-beat scheduler as its own dedicated service. Beat is NOT
# embedded in the worker (embedded -B is a dev-only convenience that dies
# with the worker), so this service is what fires the scheduled jobs — notably the
# daily data-retention purge (CMP-5 / PP-13) at 03:30 UTC. See MT-148.
[[services]]
name = "celery-beat"
dockerfile = "Dockerfile.worker"
startCommand = "celery -A backend.celery_config.celery beat --loglevel=info"

# No healthcheck needed for beat (it's not a web service)
# No public networking needed (beat connects to Redis privately)

[services.env]
SYNC_STORY_TIMEOUT_SECONDS = "75"
GEMINI_REQUEST_TIMEOUT_SECONDS = "45"
GEMINI_IMAGE_REQUEST_TIMEOUT_SECONDS = "120"
# Redis URLs - set these in Railway UI using ${{Redis.REDIS_URL}}
# beat needs the broker URL to enqueue scheduled tasks
# CELERY_BROKER_URL = "${{Redis.REDIS_URL}}"
# CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}"
# Frontend is NOT a Railway service. The Flutter web app is built in CI and
# deployed to Cloudflare Pages (project `once-upon-your-child`, custom domains
# onceuponyourchild.app + www). The old Railway `frontend`/grand-light service
# and its Dockerfile.frontend/nginx.conf were decommissioned 2026-07-16 after
# the DNS cutover soaked. CSP/headers now live in web/_headers (see cicd.yml
# deploy-production). MT-205.
