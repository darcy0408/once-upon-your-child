# Railway Multi-Service Configuration for Story Weaver App
# This configuration deploys both backend (Flask/Python) and frontend (Flutter/nginx)

# Default deployment settings (don't set global healthcheck - only for web services)
[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Backend Service (Python Flask API)
[[services]]
name = "backend"
dockerfile = "Dockerfile"
buildCommand = "pip install --no-cache-dir -r backend/requirements.txt"
startCommand = "sh -c 'gunicorn -w 1 -b 0.0.0.0:$PORT wsgi:app --timeout 120'"

[services.healthcheck]
path = "/health"
interval = 30
timeout = 10

[services.env]
FLASK_ENV = "prod"
FLASK_CONFIG = "prod"
SYNC_STORY_TIMEOUT_SECONDS = "75"
GEMINI_REQUEST_TIMEOUT_SECONDS = "45"
GEMINI_IMAGE_REQUEST_TIMEOUT_SECONDS = "120"

# Celery Worker Service (Background task processor)
[[services]]
name = "worker"
dockerfile = "Dockerfile"
startCommand = "celery -A backend.celery_config.celery worker --loglevel=info --pool=solo"

# No healthcheck needed for worker (it's not a web service)
# No public networking needed (worker connects to Redis privately)

[services.env]
CELERY_TASK_ALWAYS_EAGER = "false"
CELERY_TASK_EAGER_PROPAGATES = "false"
CELERY_TASK_STORE_EAGER_RESULT = "false"
SYNC_STORY_TIMEOUT_SECONDS = "75"
GEMINI_REQUEST_TIMEOUT_SECONDS = "45"
GEMINI_IMAGE_REQUEST_TIMEOUT_SECONDS = "120"
# Redis URLs - set these in Railway UI using ${{Redis.REDIS_URL}}
# CELERY_BROKER_URL = "${{Redis.REDIS_URL}}"
# CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}"

# Frontend Service (Flutter Web + nginx)
[[services]]
name = "frontend"
dockerfile = "Dockerfile.frontend"
buildCommand = "flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true --dart-define=FLAVOR=production"

[services.healthcheck]
path = "/"
interval = 30
timeout = 10

[services.env]
# Frontend will communicate with backend via internal Railway networking
BACKEND_URL = "${{backend.RAILWAY_PRIVATE_DOMAIN}}"
