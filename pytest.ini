[pytest]
norecursedirs = worktrees venv backend/venv
addopts = --import-mode=importlib
# Flask-Caching 2.x emits these two warnings from its own internals when
# NullCache is used. NullCache is required in tests to prevent a cachelib
# serialization bug (UnboundLocalError in cachelib.serializers). Both
# warnings are from the library, not application code.
filterwarnings =
    ignore:.*CACHE_TYPE is set to null, caching is effectively disabled.*:UserWarning
    ignore:Using the initialization functions in flask_caching\.backend is deprecated\..*:DeprecationWarning
