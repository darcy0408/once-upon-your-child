server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages (L-10, CWE-200)
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers (L-10, CWE-200)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS — force HTTPS for a year (Railway terminates TLS in front of nginx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy tuned for a Flutter web SPA.
    # - script-src needs 'unsafe-inline' + 'unsafe-eval': the Flutter bootstrap
    #   injects an inline loader and the wasm/CanvasKit runtime evals.
    # - 'wasm-unsafe-eval' covers CanvasKit/SKIA WebAssembly instantiation.
    # - https://www.gstatic.com is REQUIRED in BOTH script-src AND connect-src:
    #   Flutter web loads canvaskit.js from gstatic (script-src) and that
    #   script then fetch()es canvaskit.wasm from the same origin
    #   (connect-src). Omitting either blanks the whole app.
    # - https://browser.sentry-cdn.com lets the Sentry web SDK load.
    # - img-src/font-src allow data: + blob: (Flutter rasterizes to blobs).
    # - connect-src (S-08) is pinned to the origins the production app calls:
    #   the Railway backend API, the Sentry event-ingest host, and gstatic
    #   (for the canvaskit.wasm fetch). The production frontend (grand-light)
    #   sets no CUSTOM_BACKEND_URL override, so it uses the hardcoded default
    #   backend in lib/config/flavor_config.dart. If the backend domain or
    #   Sentry DSN ever changes, update this line.
    # - frame-ancestors 'self' mirrors X-Frame-Options for modern browsers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://www.gstatic.com https://browser.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://story-weaver-app-production.up.railway.app https://o4510948068491264.ingest.us.sentry.io https://www.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
