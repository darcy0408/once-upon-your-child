name: story_weaver_app
description: "Story Weaver - Personalized stories that help kids build coping skills and emotional strength."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Core dependencies for Story Weaver
  cupertino_icons: ^1.0.9
  http: ^1.2.1              # API calls to backend
  flutter_tts: ^4.2.5       # Text-to-speech for stories
  speech_to_text: ^7.3.0    # Voice input for superpower/quest fields
  shared_preferences: ^2.5.5 # Local storage
  share_plus: ^12.0.2       # Share stories
  flutter_riverpod: ^2.6.1
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  uuid: ^4.5.3              # Generate unique IDs
  path_provider: ^2.1.1     # File paths
  path: ^1.9.0               # Path manipulation utilities
  camera: ^0.12.0            # Snapshot photos for custom avatars
  image_picker: ^1.1.2       # Pick images from gallery
  riverpod_annotation: ^2.6.1
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  sentry_flutter: ^9.16.0    # Crash reporting and error monitoring
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  page_flip_builder: ^0.1.4  # Premium page-turn animations
  flutter_svg: ^2.0.10  # SVG rendering for avatars
  google_fonts: ^8.0.2  # Quicksand font for magical UI
  crypto: ^3.0.3  # SHA256 hashing for avatar cache keys
  audioplayers: ^6.1.0  # For background ambience and SFX
  wakelock_plus: ^1.2.8  # Keep the screen alive during screen-free bedtime narration
  # STORE-1 (MT-143): in-app purchases for the iOS/Android store builds.
  # Apple/Google require their own billing for digital subscriptions; Stripe
  # web checkout is an automatic store rejection. The plugin is dispatched via
  # the conditional-import split in lib/services/payment/ so it is compiled
  # OUT of the web build (where Stripe remains the payment channel).
  in_app_purchase: ^3.2.0

  # Note: Backend handles AI generation for free users, but BYOK users call Gemini directly
  flutter_secure_storage: ^10.0.0 # Encrypted storage for API keys
  image: ^4.8.0
  # Premium PDF storybook export (keepsake feature): pdf builds the document,
  # printing's sharePdf hands it to the OS share sheet on both mobile and web.
  pdf: ^3.12.0
  printing: ^5.14.3

  # meta: Removed explicit dependency - let Flutter SDK manage version to avoid integration_test conflicts
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0

  # Accessibility (WCAG 2.2 AA) lint runner + local custom rule plugin.
  # Pinned to custom_lint 0.6.0/0.6.1 — those releases let custom_lint_builder
  # accept analyzer < 6.4 (needed; see the analyzer pin in dependency_overrides).
  custom_lint: '>=0.6.0 <0.6.2'
  a11y_lint:
    path: tools/a11y_lint

dependency_overrides:
  meta: 1.15.0
  # A11Y Phase 0: pinned to analyzer 6.3.0 — the one version that satisfies
  # every constraint at once:
  #  * `custom_lint` (tools/a11y_lint plugin) needs custom_lint_builder 0.6.x;
  #    builder 0.6.0/0.6.1 accept `analyzer >=5.12.0 <7.0.0`.
  #  * `isar_generator` 3.1.0 caps `analyzer <6.0.0` (stale cap; Isar 3.x
  #    codegen runs fine on 6.x — verified here with build_runner), overridden.
  #  * `analyzer_plugin` 0.11.2 (a custom_lint dep) calls `enclosingElement3`,
  #    which analyzer 6.4.x REMOVED — so analyzer must stay < 6.4.0.
  # 6.3.0 is the intersection. Revisit when Isar / custom_lint are upgraded.
  analyzer: 6.3.0
  # CQ-02 fix: the pub solver picks analyzer_plugin 0.11.2 by default, but 0.11.2
  # was BUILT against analyzer >=6.4 and calls symbols absent from 6.3.0
  # (`Element.enclosingElement3`, `NamedType.name`) — so `dart run custom_lint`
  # and the `flutter analyze` plugin hook both die with "Failed to start the
  # plugins" and the WCAG a11y gate (tools/a11y_lint/) never runs. 0.11.3 declares
  # `analyzer ^6.0.0` and compiles cleanly against 6.3.0, so the gate starts and
  # reports findings. Keep this in lockstep with the analyzer 6.3.0 pin above;
  # both can be removed once an Isar 3→4 migration lifts the analyzer cap.
  analyzer_plugin: 0.11.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets for Story Weaver - minimize to essential only
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/ui/sprout/tiles/
    - assets/images/ui/creator/
    - assets/images/ui/gender/
    - assets/images/ui/clean/
    - assets/images/archetypes/
    - assets/images/archetypes/sprout/
    - assets/images/archetypes/explorer/
    - assets/images/archetypes/adventurer/
    - assets/images/archetypes/creator/
    - assets/images/archetypes/adolescent/
    - assets/images/archetypes/adult/
    - assets/images/companions/
    - assets/images/companions/sprout/
    - assets/images/companions/explorer/
    - assets/images/companions/adventurer/
    - assets/images/companions/creator/
    - assets/images/companions/adolescent/
    - assets/images/companions/adult/
    - assets/images/feelings/sprout/
    - assets/images/feelings/explorer/
    - assets/images/feelings/adventurer/
    - assets/images/feelings/creator/
    - assets/images/feelings/adolescent/
    - assets/images/feelings/adult/
    - assets/images/scenes/explorer/
    - assets/images/scenes/adventurer/
    - assets/images/scenarios/
    - assets/images/scenarios/adventurer/
    - assets/images/scenarios/creator/
    - assets/images/scenarios/adolescent/
    - assets/images/scenarios/adult/
    - assets/feelings_faces/
    - assets/sounds/
    - assets/config/
    - assets/avatars/midjourney/
    - assets/avatars/midjourney/metadata.json
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts bundled locally so tests (and offline builds) can render them
  # without network access.  GoogleFonts.cinzelDecorative() falls back to this
  # registered family when allowRuntimeFetching = false.
  fonts:
    - family: Cinzel Decorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
