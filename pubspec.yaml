name: story_weaver_app
description: "Story Weaver - Therapeutic AI-generated stories for emotional growth and learning."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Core dependencies for Story Weaver
  cupertino_icons: ^1.0.9
  http: ^1.2.1              # API calls to backend
  flutter_tts: ^4.2.5       # Text-to-speech for stories
  speech_to_text: ^7.3.0    # Voice input for superpower/quest fields
  shared_preferences: ^2.5.5 # Local storage
  share_plus: ^12.0.2       # Share stories
  flutter_riverpod: ^2.6.1
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  uuid: ^4.5.3              # Generate unique IDs
  path_provider: ^2.1.1     # File paths
  path: ^1.9.0               # Path manipulation utilities
  camera: ^0.12.0            # Snapshot photos for custom avatars
  image_picker: ^1.1.2       # Pick images from gallery
  riverpod_annotation: ^2.6.1
  google_generative_ai: ^0.4.6  # Direct Gemini API access for BYOK users
  firebase_core: ^4.6.0
  firebase_analytics: ^12.2.0
  sentry_flutter: ^9.16.0    # Crash reporting and error monitoring
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.0
  page_flip_builder: ^0.1.4  # Premium page-turn animations
  flutter_svg: ^2.0.10  # SVG rendering for avatars
  google_fonts: ^8.0.2  # Quicksand font for magical UI
  crypto: ^3.0.3  # SHA256 hashing for avatar cache keys
  audioplayers: ^6.1.0  # For background ambience and SFX

  # Note: Backend handles AI generation for free users, but BYOK users call Gemini directly
  flutter_secure_storage: ^10.0.0 # Encrypted storage for API keys

  # meta: Removed explicit dependency - let Flutter SDK manage version to avoid integration_test conflicts
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.3
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0

dependency_overrides:
  meta: 1.15.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets for Story Weaver - minimize to essential only
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/images/ui/sprout/
    - assets/images/ui/sprout/tiles/
    - assets/images/ui/explorer/
    - assets/images/ui/adventurer/
    - assets/images/ui/creator/
    - assets/images/ui/adolescent/
    - assets/images/ui/adult/
    - assets/images/ui/clean/
    - assets/images/ui/glassy/
    - assets/images/archetypes/
    - assets/images/archetypes/sprout/
    - assets/images/archetypes/explorer/
    - assets/images/archetypes/adventurer/
    - assets/images/archetypes/creator/
    - assets/images/archetypes/adolescent/
    - assets/images/archetypes/adult/
    - assets/images/companions/
    - assets/images/companions/sprout/
    - assets/images/companions/explorer/
    - assets/images/companions/adventurer/
    - assets/images/companions/creator/
    - assets/images/companions/adolescent/
    - assets/images/companions/adult/
    - assets/images/feelings/sprout/
    - assets/images/feelings/explorer/
    - assets/images/feelings/adventurer/
    - assets/images/feelings/creator/
    - assets/images/feelings/creator/boy/
    - assets/images/feelings/creator/girl/
    - assets/images/feelings/adolescent/
    - assets/images/feelings/adolescent/boy/
    - assets/images/feelings/adolescent/girl/
    - assets/images/feelings/adult/
    - assets/images/orbs/sprout/
    - assets/images/orbs/explorer/
    - assets/images/orbs/adventurer/
    - assets/images/orbs/creator/
    - assets/images/orbs/adolescent/
    - assets/images/orbs/adult/
    - assets/images/backgrounds/sprout/
    - assets/images/backgrounds/explorer/
    - assets/images/backgrounds/adventurer/
    - assets/images/backgrounds/creator/
    - assets/images/backgrounds/adolescent/
    - assets/images/backgrounds/adult/
    - assets/images/scenes/sprout/
    - assets/images/scenes/explorer/
    - assets/images/scenes/adventurer/
    - assets/images/scenes/creator/
    - assets/images/scenes/adolescent/
    - assets/images/scenes/adult/
    - assets/images/scenarios/
    - assets/images/themes/
    - assets/feelings_faces/
    - assets/mood_lanterns/
    - assets/sounds/
    - assets/config/
    - assets/avatars/midjourney/
    - assets/avatars/midjourney/metadata.json
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts bundled locally so tests (and offline builds) can render them
  # without network access.  GoogleFonts.cinzelDecorative() falls back to this
  # registered family when allowRuntimeFetching = false.
  fonts:
    - family: Cinzel Decorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
