providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "postgresql", "pkg-config"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install --no-cache-dir -r backend/requirements.txt",
  "python -c \"import psycopg2, sys; print('psycopg2 import ok', sys.version)\""
]

[start]
cmd = "gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2"
