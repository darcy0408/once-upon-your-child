name: Backend Tests

on:
  push:
    branches: [main, 'gemini/**', 'codex/**', 'grok/**']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-flask

      - name: Audit dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit --requirement backend/requirements.txt --skip-editable

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://postgres:testpassword@localhost:5432/test_db" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "FLASK_ENV=testing" >> $GITHUB_ENV
          # Throwaway CI-only values (NOT production secrets). The eager-Celery
          # path and the test_app_creation smoke test build a non-"testing" app,
          # which runs _run_security_assertions; a >=32-char JWT secret lets them
          # pass exactly as they do against a local .env. Stripe price id is a
          # dummy so the checkout-contract route gets past its env-presence guard.
          echo "JWT_SECRET_KEY=ci-test-only-jwt-secret-not-a-real-credential-0123456789abcdef" >> $GITHUB_ENV
          echo "STRIPE_PRICE_ID_PREMIUM=price_test_dummy_ci" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage