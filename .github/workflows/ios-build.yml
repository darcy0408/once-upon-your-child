name: iOS Build (No Codesign)

# macos-latest runners are the only jobs here that meter on a public repo, and
# they bill at 10x Linux. Triggering on 'lib/**' fired this on nearly every PR
# and consumed $75 of the ~$80 monthly allowance in July 2026, which blocked all
# CI account-wide. Keep this scoped to genuine iOS changes; use workflow_dispatch
# before a release.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned — unpinned `stable` broke main 2026-08-14 (see main_tests.yml).
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install iOS pods
        run: |
          cd ios
          pod install --repo-update

      # MT-239: SwiftPM's binary-artifact cache can land a partial/duplicate
      # Sentry.xcframework.zip ("already exists in file system"), which fails
      # `xcodebuild` package resolution and is NOT cleared by a plain re-run.
      # Clear it before building so a poisoned entry can't block the build.
      - name: Clear poisoned SwiftPM artifact cache (MT-239)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          rm -rf ios/.build

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: |
            /Users/runner/Library/Logs/CocoaPods
            /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs
          if-no-files-found: ignore
          retention-days: 7
