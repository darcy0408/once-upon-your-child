name: Eval Judge Resume (MT-186)

# Resume the GitHub Models judge daily to climb toward N>=200 cells for a
# confident inter-judge agreement number. The free Student-tier quota
# resets ~daily; the script bails on the first RateLimitError so each run
# does as much as the day allows.
#
# Requires repo secret: GITHUB_MODELS_TOKEN (fine-grained PAT with the
# "Models" account permission). Different from the auto-provided
# GITHUB_TOKEN — that one can't hit models.github.ai.

on:
  schedule:
    # 01:30 UTC daily — just after the GitHub Models daily reset, gives
    # the run the full day's quota and keeps the routine off the user's
    # local machine timezone.
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Eval run-id to resume (default: the Audit 05 main run)'
        required: false
        default: '20260522-153126-a76436'

permissions:
  contents: write  # to commit updated scores.jsonl back to the branch

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/eval/requirements.txt

      - name: Run judge resume
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          # Provide GEMINI_API_KEY too so the judge module can import providers cleanly
          # (only github-models is actually called via --judges, but the providers
          # module touches both on init).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_ID: ${{ github.event.inputs.run_id || '20260522-153126-a76436' }}
        run: |
          python -m backend.eval.judge --run-id "$RUN_ID" --judges github-models --throttle-sec 4

      - name: Commit updated scores
        env:
          RUN_ID: ${{ github.event.inputs.run_id || '20260522-153126-a76436' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet "backend/eval/results/$RUN_ID/scores.jsonl"; then
            echo "No new scores this run (quota likely already burned). Skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Capture row count for the commit message
          ROWS=$(wc -l < "backend/eval/results/$RUN_ID/scores.jsonl")
          GH_ROWS=$(grep -c '"judge": "github-models"' "backend/eval/results/$RUN_ID/scores.jsonl" || true)
          git add "backend/eval/results/$RUN_ID/scores.jsonl"
          git commit -m "chore(eval): resume judge — github-models cells now at ${GH_ROWS}" \
                     -m "Automated daily run; total scores.jsonl rows: ${ROWS}." \
                     -m "Resume-safe: re-runs daily until N>=200 for a confident agreement metric."
          git push origin HEAD:main
