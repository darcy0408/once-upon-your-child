name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  rollback-frontend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Notify Rollback Start
        run: |
          echo "Starting frontend rollback due to: ${{ github.event.inputs.reason }}"

      - name: Rollback Netlify Deployment
        run: |
          # This would typically involve redeploying a previous version
          # For Netlify, we can redeploy from git history
          echo "Rolling back frontend to previous deployment"

      - name: Verify Rollback
        run: |
          # Health check after rollback
          echo "Frontend rollback completed"

  rollback-backend:
    runs-on: ubuntu-latest
    environment: production
    # RAILWAY_TOKEN is read from the environment by the CLI for every step
    # below — never pass it as a CLI argument (L-11: tokens on the command line
    # leak into logs/ps).
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Rollback Railway Deployment
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          # Railway supports rollbacks via CLI or dashboard
          railway rollback --yes

      - name: Health check after rollback
        run: |
          sleep 30
          echo "Backend rollback completed"

  notify-teams:
    runs-on: ubuntu-latest
    needs: [rollback-frontend, rollback-backend]
    if: always()
    steps:
      - name: Send Rollback Notification
        # Skip cleanly when Slack isn't configured, so the notify job doesn't
        # fail (empty webhook -> action error) during a real rollback. Mirrors
        # the guard in health-monitoring.yml. (MT-225)
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Production Rollback Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Rollback Completed*\nReason: ${{ github.event.inputs.reason }}\nTime: $(date)\nStatus: ${{ job.status }}\n\nBoth frontend and backend have been rolled back to previous stable versions."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}