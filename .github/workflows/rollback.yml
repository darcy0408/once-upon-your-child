name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend rollback: the prod frontend lives on Cloudflare Pages (moved off
  # Netlify/Railway — see PR #169). Roll back a frontend deploy from the
  # Cloudflare Pages dashboard (Workers & Pages > story-weaver > Deployments
  # > pick a previous deployment > Rollback to this deployment); there is no
  # CI job for it. The old `rollback-frontend` job here was a pure-echo
  # no-op targeting the orphaned Netlify site and was removed (backend
  # deadwood removal wave 1, 2026-07-07).
  rollback-backend:
    runs-on: ubuntu-latest
    environment: production
    # RAILWAY_TOKEN is read from the environment by the CLI for every step
    # below — never pass it as a CLI argument (L-11: tokens on the command line
    # leak into logs/ps).
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Rollback Railway Deployment
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          # Railway supports rollbacks via CLI or dashboard
          railway rollback --yes

      - name: Health check after rollback
        run: |
          sleep 30
          echo "Backend rollback completed"

  notify-teams:
    runs-on: ubuntu-latest
    needs: [rollback-backend]
    if: always()
    steps:
      - name: Send Rollback Notification
        # Skip cleanly when Slack isn't configured, so the notify job doesn't
        # fail (empty webhook -> action error) during a real rollback. (MT-225)
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 Production Rollback Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Rollback Completed*\nReason: ${{ github.event.inputs.reason }}\nTime: $(date)\nStatus: ${{ job.status }}\n\nBackend has been rolled back to a previous stable version. Frontend rollback (Cloudflare Pages) is handled separately from the CF dashboard."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}