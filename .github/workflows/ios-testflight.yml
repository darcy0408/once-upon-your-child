name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What changed in this build"
        required: false
        default: "Automated TestFlight build from GitHub Actions"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-testflight:
    name: Build and Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.storyweaver.storyWeaverApp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned — unpinned `stable` broke main 2026-08-14 (see main_tests.yml).
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install iOS pods
        run: |
          cd ios
          pod install --repo-update

      - name: Decode signing certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
        run: |
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > ios_certificate.p12

      - name: Create temporary keychain and import certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import ios_certificate.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      # MT-239: clear SwiftPM's binary-artifact cache before resolving packages,
      # so a poisoned/duplicate Sentry.xcframework.zip can't fail the build.
      - name: Clear poisoned SwiftPM artifact cache (MT-239)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          rm -rf ios/.build

      # The signing team comes from DEVELOPMENT_TEAM in Runner.xcodeproj, set on
      # all three Runner configs (2026-08-16). It used to be passed here as
      # --dart-define=IOS_DEVELOPMENT_TEAM, which only defines a Dart
      # compile-time constant and never reached the Xcode build setting — so
      # signing was never actually configured. Removed rather than left to imply
      # otherwise. The IOS_DEVELOPMENT_TEAM repo secret is now unused.
      # Manual signing (2026-09-01): CI has no Apple ID in Xcode, so automatic
      # signing dies with "No Accounts". Release config in Runner.xcodeproj pins
      # CODE_SIGN_STYLE=Manual + the App Store profile; ExportOptions.plist
      # carries the same mapping for the export step.
      - name: Build signed IPA for App Store Connect
        run: |
          flutter build ipa \
            --release \
            --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Configure App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Upload IPA to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          # The IPA is already on TestFlight by this step; the artifact is a
          # debugging keepsake, not the distribution channel.
          retention-days: 7
