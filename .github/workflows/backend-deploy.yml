name: Backend Deployment

on:
  push:
    branches: [ main, grok/cicd-enhancement ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  deploy-backend-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/grok/cicd-enhancement'
    environment: staging
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Staging
        # RAILWAY_TOKEN is read from the environment by the CLI — never pass it
        # as a CLI argument (L-11: tokens on the command line leak into logs/ps).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID_STAGING }}
          railway up --detach

      - name: Health check
        run: |
          sleep 30
          # Health check for staging
          echo "Backend staging deployed successfully"

  deploy-backend-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Production
        # RAILWAY_TOKEN is read from the environment by the CLI — never pass it
        # as a CLI argument (L-11: tokens on the command line leak into logs/ps).
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --detach

      - name: Health check
        run: |
          sleep 30
          # Health check for production
          echo "Backend production deployed successfully"