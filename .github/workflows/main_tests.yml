name: Story Weaver Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-mock  # Ensure mock is installed

    - name: Run Unit Tests
      run: |
        PYTHONPATH=${{ github.workspace }}/backend pytest tests/api tests/security tests/unit -q --tb=short

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze (compile-error gate)
      # Static-analyzes ALL of lib/, catching undefined params / type errors —
      # the class of break that slips past `flutter test`, which only compiles
      # the deps imported by the chosen test files. PR #176 shipped a
      # `SceneImageButton.showDescription` call site without the widget param
      # and broke `main` precisely because nothing here compiled that widget.
      # Only errors are fatal so latent warnings/infos don't block PRs; tighten
      # to --fatal-warnings once lib/ is warning-clean.
      run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

    - name: Run unit & service tests
      run: flutter test --no-pub -r compact test/unit

    - name: Run widget, screen, model, a11y & integration tests
      # MT-228: these suites are the ONLY thing that catches a client-side
      # story-generation crash (backend audits + prod smoke tests bypass the
      # Flutter client) — they had silently rotted because CI never ran them.
      # The Flutter-version-sensitive ListTile-in-DecoratedBox assertions that
      # blocked this earlier were fixed at the source (AppCard + the parent-
      # controls toggle now wrap their tiles in a transparent Material).
      # Excludes test/goldens: Windows-baked pixel baselines won't match Linux.
      run: >
        flutter test --no-pub -r compact
        test/widgets test/screens test/models test/a11y test/integration
