name: CI/CD Pipeline

on:
  push:
    branches: [ main, grok/cicd-enhancement ]
    paths:
      - 'lib/**'
      - 'backend/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cicd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'backend/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/cicd.yml'

env:
  FLUTTER_VERSION: 'stable'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Testing
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter baseline service suite (deterministic)
        run: flutter test --no-pub test/unit/services -r compact

  # Backend Testing
  backend-test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend API baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/api -q

      - name: Run backend security baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/security -q

      - name: Run backend unit tests
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/unit -q

      - name: Run backend integration baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/integration/test_story_generation_integration.py -q

  # API Contract Tests
  api-contract-tests:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run API contract tests
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/api/ --maxfail=1

  # Build Flutter Web
  build-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/grok/cicd-enhancement'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Flutter build
        uses: actions/cache@v6
        with:
          path: build
          # `prodflavor` suffix busts the cache once so the FLAVOR=production
          # dart-define below actually takes effect (Flutter's incremental build
          # doesn't reliably detect dart-define changes). Bump if defines change.
          key: ${{ runner.os }}-flutter-build-prodflavor-${{ hashFiles('**/*.dart', '**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-prodflavor-

      - name: Build web release
        # FLAVOR=production is REQUIRED: without it FlavorConfig defaults to the
        # development flavor whose backend is http://127.0.0.1:5000, so every
        # backend call (incl. story generation) hits the user's localhost and
        # fails. Mirror the Railway Dockerfile.frontend defines. (MT-204)
        run: flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true --dart-define=FLAVOR=production --dart-define=CUSTOM_BACKEND_URL=https://story-weaver-app-production.up.railway.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flutter-web-build
          path: build/web/
          retention-days: 7

  # Deploy Frontend to Cloudflare Pages (Production)
  # Replaces the previous Netlify staging + production jobs. The frontend now
  # lives on Cloudflare Pages (free, commercial-use OK, unlimited bandwidth,
  # global edge CDN); the backend stays on Railway auto-deploy (see below).
  #
  # One-time setup required before this job will work:
  #   1. Create a Cloudflare Pages project as a "Direct Upload" project named
  #      exactly `once-upon-your-child` (or change --project-name below).
  #   2. Add two repo secrets:
  #        CLOUDFLARE_API_TOKEN  — token scoped to "Account > Cloudflare Pages: Edit"
  #        CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
  #   3. In the Pages project, add the custom domain onceuponyourchild.app and
  #      cut DNS over once a deploy is verified.
  # The web/_headers file (ported from nginx.conf) and web/_redirects SPA
  # fallback are copied into build/web by `flutter build web`, so the CSP and
  # routing carry over automatically.
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-frontend, backend-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: flutter-web-build
          path: build/web/

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=once-upon-your-child --branch=main
