name: CI/CD Pipeline

on:
  push:
    branches: [ main, grok/cicd-enhancement ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION: 'stable'
  PYTHON_VERSION: '3.11'

jobs:
  # Frontend Testing
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter baseline service suite (deterministic)
        run: flutter test --no-pub test/unit/services -r compact

  # Backend Testing
  backend-test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend API baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/api -q

      - name: Run backend security baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/security -q

      - name: Run backend unit tests
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/unit -q

      - name: Run backend integration baseline suite (deterministic)
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/integration/test_story_generation_integration.py -q

  # API Contract Tests
  api-contract-tests:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run API contract tests
        run: |
          PYTHONPATH=${{ github.workspace }}/backend pytest tests/api/ --maxfail=1

  # Build Flutter Web
  build-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/grok/cicd-enhancement'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            .flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Flutter build
        uses: actions/cache@v5
        with:
          path: build
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/*.dart', '**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-build-

      - name: Build web release
        run: flutter build web --release --dart-define=FLUTTER_WEB_USE_SKIA=true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: flutter-web-build
          path: build/web/
          retention-days: 7

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-frontend, backend-test]
    if: github.ref == 'refs/heads/grok/cicd-enhancement'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: flutter-web-build
          path: build/web/

      - name: Deploy to Netlify (Staging)
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (Staging)"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN_STAGING }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_STAGING }}
        timeout-minutes: 1

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-frontend, backend-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: flutter-web-build
          path: build/web/

      - name: Deploy to Netlify (Production)
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './build/web'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions (Production)"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 1

  # Backend Deployment Check
  backend-deploy-check:
    runs-on: ubuntu-latest
    needs: [backend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/grok/cicd-enhancement'
    steps:
      - name: Check Railway deployment status
        run: |
          echo "Backend deployment should be handled by Railway auto-deploy"
          echo "Monitor Railway dashboard for deployment status"
          echo "Railway URL: https://railway.app/project/..."
