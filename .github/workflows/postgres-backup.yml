name: Postgres Backup

# Daily off-Railway logical backup of the production Postgres database.
# Railway native volume backups require the Pro plan; this workflow gives the
# Hobby plan an equivalent (and account-loss-resilient) safety net by pushing a
# pg_dump to a Cloudflare R2 bucket.
#
# Runs daily on a schedule (and on demand via workflow_dispatch). Depends on
# five repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_PUBLIC_URL   — Railway Postgres public connection string
#   R2_ACCOUNT_ID         — Cloudflare account id (R2 endpoint host prefix)
#   R2_ACCESS_KEY_ID      — R2 API token access key
#   R2_SECRET_ACCESS_KEY  — R2 API token secret
#   R2_BUCKET             — target bucket name (e.g. story-weaver-pg-backups)
#
# Retention: dumps older than RETENTION_DAYS (default 30) are pruned from R2
# at the end of each run so the bucket stays within the free 10 GB tier.
# Smoke check: each dump is verified to be a parseable pg_dump archive before
# upload (FMEA finding P2 — untested backups are not backups).
on:
  # Schedule disabled in this repo: the daily backup runs from the private ops
  # repo, which holds the DATABASE/R2 secrets. Manual runs remain available.
  workflow_dispatch: {}    # manual run — also available on demand

permissions:
  contents: read
  issues: write            # to open an alert issue if a backup fails

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump Postgres
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          DUMP_FILE="story-weaver-pg-$(date -u +%Y-%m-%d).sql.gz"
          echo "DUMP_FILE=$DUMP_FILE" >> "$GITHUB_ENV"
          # pg_dump from the official image's latest tag so the client version
          # always keeps pace with the Railway server (pg_dump refuses a server
          # newer than itself; newer client against older server is fine).
          docker run --rm postgres:alpine \
            pg_dump "$DATABASE_PUBLIC_URL" --no-owner --no-privileges \
            | gzip > "$DUMP_FILE"
          SIZE=$(stat -c%s "$DUMP_FILE")
          echo "Dump size: ${SIZE} bytes"
          # A real dump is several KB even for a near-empty schema; anything
          # tiny means pg_dump produced nothing useful — fail loudly.
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Dump file is suspiciously small (${SIZE} bytes) — aborting."
            exit 1
          fi

      - name: Verify dump is readable (closes FMEA finding P2)
        run: |
          set -euo pipefail
          # 1. gzip integrity — catches a truncated upload mid-dump.
          gzip -t "$DUMP_FILE"
          echo "gzip archive integrity: ok"
          # 2. Content sanity — a real pg_dump archive begins with the
          # "PostgreSQL database dump" banner. Anything else (e.g. a
          # captured error page) fails here loudly.
          # NB: capture the header into a variable FIRST. Piping
          # `gunzip -c | head -50 | grep -q` directly tripped `pipefail`:
          # grep exits on its first match, head closes the pipe, and gunzip
          # dies with SIGPIPE (exit 141) — which pipefail then reports as a
          # pipeline failure, rejecting a perfectly valid dump (this silently
          # broke every backup from 2026-05-29 on). `|| true` absorbs the
          # expected SIGPIPE; grep then runs over the captured string with no
          # pipe, so no SIGPIPE.
          header="$(gunzip -c "$DUMP_FILE" 2>/dev/null | head -50 || true)"
          if ! grep -q "PostgreSQL database dump" <<<"$header"; then
            echo "::error::Dump does not contain the expected pg_dump header — aborting before upload."
            exit 1
          fi
          echo "Dump banner check: ok"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the aws-cli v2 default integrity checksums; only send
          # them when the operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp "$DUMP_FILE" "s3://${{ secrets.R2_BUCKET }}/postgres/$DUMP_FILE" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          echo "Uploaded postgres/$DUMP_FILE to R2 bucket ${{ secrets.R2_BUCKET }}"

      - name: Prune dumps older than RETENTION_DAYS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          RETENTION_DAYS: '30'
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          cutoff_ts=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Pruning postgres/ dumps older than ${RETENTION_DAYS} days (cutoff=$(date -u -d "@${cutoff_ts}" -Iseconds))"
          # `aws s3api list-objects-v2` returns ISO timestamps GNU date can parse.
          # Stay defensive: an empty bucket yields no output and the loop is a no-op.
          aws s3api list-objects-v2 \
            --bucket "${{ secrets.R2_BUCKET }}" \
            --prefix postgres/ \
            --endpoint-url "$R2_ENDPOINT" \
            --query 'Contents[].[Key,LastModified]' \
            --output text 2>/dev/null \
          | while read -r key last_modified; do
              [ -z "${key:-}" ] && continue
              obj_ts=$(date -u -d "$last_modified" +%s)
              if [ "$obj_ts" -lt "$cutoff_ts" ]; then
                echo "  prune: $key (lastModified=$last_modified)"
                aws s3 rm "s3://${{ secrets.R2_BUCKET }}/$key" --endpoint-url "$R2_ENDPOINT"
              fi
            done
          echo "Prune complete."

      - name: Open an issue if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔴 Postgres backup FAILED ($(date -u +%Y-%m-%d))" \
            --body "The daily Postgres backup to R2 failed in run ${{ github.run_id }}. Production may be running without a fresh off-site backup — investigate.

          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Could not open alert issue (continuing)."
