[pytest]
pythonpath = .
markers =
    api_contract: API contract tests for public endpoints
filterwarnings =
    ignore:.*CACHE_TYPE is set to null, caching is effectively disabled.*:UserWarning
    ignore:Using the initialization functions in flask_caching\.backend is deprecated\..*:DeprecationWarning
    ignore:Can't sort tables for DROP; an unresolvable foreign key dependency exists between tables:sqlalchemy.exc.SAWarning
    ignore:datetime\.datetime\.utcnow\(\) is deprecated and scheduled for removal.*:DeprecationWarning
